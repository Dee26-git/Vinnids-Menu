
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage - Vinnid Innovations</title>
    
   
</head>
<body>
    
    <h1 style="position: fixed centre;" class="brand-heading"><b>VINNID - INNOVATIONS</b></h1>
     
    <header>
        
        
        <br>
         <p>
            <h1 style="color: #ffffff;">
                <br>
                    <br>
                <b> Explore Our Offerings: Check out our latest Products, artisanal bakery items, as well as other Services</b>       
            </h1>
         </p>
        
        <div class="btn-group">
            <a href="ex menu/menu.html" class="menu-btn">EXPLORE MENU</a>
            <a href="about.html" class="about-btn">ABOUT US</a>
        </div>
    </header>
 <style>
        :root {
            --pink-main: #ff69b4;
            --pink-accent: #ff1493;
            --blue-main: #2563eb;
            --dark-bg: #0f172a;
            --text-light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            min-height: 90vh;
            background-image: url(logo.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
        }

        .brand-heading {
            color: var(--pink-accent);
            text-align: center;
            padding-top: 1.5rem;
            letter-spacing: 2px;
            
        }

        header {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            
        }

        header h1 {
            color: var(--pink-main);
            font-size: 2.2rem;
            max-width: 800px;
            margin-bottom: 2.5rem;
            text-shadow: 0 0 10px rgba(255,105,180,0.3);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .menu-btn {
            display: inline-block;
            background-color: var(--pink-main);
            color: #ffffff;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: background-color 0.3s, transform 0.2s;
        }

        .menu-btn:hover {
            background-color: var(--pink-accent);
            transform: translateY(-2px);
        }

        .about-btn {
            display: inline-block;
            background-color: var(--blue-main);
            color: #ffffff;
            padding: 1rem 2.0rem;
            font-size: 1.0rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 35px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: background-color 0.3s, transform 0.4s;
        }

        .about-btn:hover {
            background-color: var(--pink-accent);
            transform: translateY(-1px);
        }
    </style>
</body>
</html>
