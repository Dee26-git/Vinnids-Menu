<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinnid Innovations | Culinary & Event Management</title>
  
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-obsidian: #05070e;
            --bg-surface: rgba(11, 15, 29, 0.82);
            --bg-surface-hover: rgba(16, 22, 43, 0.92);
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-glow: rgba(99, 102, 241, 0.5);
            --accent-blue: #4f46e5;
            --accent-indigo: #6366f1;
            --accent-magenta: #ec4899;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            /* Change 'your-background.jpg' */
            --bg-image: url(../vinnid\'s/pic.jpg);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            position: relative;
            background-color: var(--bg-obsidian);
            background-image: 
                radial-gradient(ellipse 60% 50% at 15% 75%, rgba(59, 130, 246, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 55% 45% at 85% 85%, rgba(236, 72, 153, 0.1) 0%, transparent 70%);
            color: var(--text-primary);
            font-family: var(--font-main);
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Floating Glass Pill Navbar */
        header {
            position: fixed;
            top: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 3rem);
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.25rem;
            background: rgba(11, 15, 29, 0.72);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            z-index: 1000;
        }

        .brand {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-magenta));
            box-shadow: 0 0 12px var(--accent-magenta);
        }

        .cta-consultation {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-magenta) 100%);
            color: #fff;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.6rem 1.35rem;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .cta-consultation:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 25px rgba(236, 72, 153, 0.5);
        }

        /* Upper Hero Section with Top Background Image */
        .hero {
            position: relative;
            z-index: 5;
            min-height: 92vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8rem 2rem 6rem;
            overflow: hidden;
        }

        /* Background photo confined to the upper hero section */
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 0.42;
            filter: saturate(1.15) contrast(1.05);
            z-index: -2;
        }

        /* Blue/Pink radial glow + smooth bottom fade into obsidian */
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 65% 50% at 50% 10%, rgba(79, 70, 229, 0.38) 0%, transparent 70%),
                radial-gradient(ellipse 50% 45% at 85% 25%, rgba(236, 72, 153, 0.25) 0%, transparent 70%),
                linear-gradient(180deg, rgba(5, 7, 14, 0.45) 0%, rgba(5, 7, 14, 0.72) 65%, var(--bg-obsidian) 100%);
            z-index: -1;
        }

        /* Faint fintech grid overlay in the upper section */
        .hero-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 80% 65% at 50% 25%, #000 30%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 80% 65% at 50% 25%, #000 30%, transparent 100%);
            pointer-events: none;
            z-index: -1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #e0e7ff;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5.5vw, 4.75rem);
            font-weight: 800;
            letter-spacing: -0.035em;
            max-width: 860px;
            line-height: 1.08;
            margin-bottom: 1.25rem;
            color: #ffffff;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        }

        .hero h1 span {
            background: linear-gradient(90deg, #818cf8 0%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #e2e8f0;
            font-size: 1.1rem;
            max-width: 560px;
            margin-bottom: 2.25rem;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8);
        }

        .hero-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-magenta) 100%);
            color: #fff;
            font-weight: 600;
            padding: 0.9rem 2rem;
            font-size: 0.95rem;
            text-decoration: none;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(79, 70, 229, 0.45);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.55);
        }

        .btn-outline {
            background: rgba(11, 15, 29, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-primary);
            font-weight: 600;
            padding: 0.9rem 2rem;
            font-size: 0.95rem;
            text-decoration: none;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Service Pillars Grid overlapping bottom edge of hero */
        .pillars-section {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: -3.5rem auto 0;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 1.75rem;
        }

        .pillar-card, .menu-card {
            background: var(--bg-surface);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.65);
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .pillar-card:hover, .menu-card:hover {
            transform: translateY(-4px);
            background: var(--bg-surface-hover);
            border-color: var(--border-glow);
        }

        .pillar-card {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .pillar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pillar-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .pillar-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.14);
            border: 1px solid rgba(99, 102, 241, 0.25);
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
        }

        .pillar-gallery {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 0.75rem;
        }

        .pillar-gallery img {
            width: 100%;
            height: 118px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #13192e;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pillar-gallery img:first-child {
            grid-row: span 2;
            height: 244px;
        }

        /* Signature Menu Preview */
        .menu-section {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 6rem auto;
            padding: 0 2rem;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 2.35rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.75rem;
        }

        .menu-card {
            overflow: hidden;
            padding: 0.85rem;
        }

        .menu-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }

        @media (max-width: 768px) {
            header {
                width: calc(100% - 2rem);
                padding: 0.65rem 1rem;
            }
            .hero {
                padding: 7rem 1.5rem 5rem;
                min-height: 85vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <span class="brand-dot"></span>
            Vinnid Innovations
        </a>
        <a href="about us/about us.html" class="cta-consultation">About Us ↗</a>
    </header>

    <section class="hero">
        <div class="hero-grid"></div>
        <div class="hero-badge">Culinary & Event Management</div>
        <h1>Exceptional Food. <span>Seamless Events.</span> Anywhere.</h1>
      
        <div class="hero-actions">
            <a href="ex menu/menu.html" class="btn-primary">Explore Menu</a>
         
        </div>
    </section>

    <section class="pillars-section" id="services">
        <div class="pillar-card">
            <div class="pillar-header">

                <h3>Indoor Catering</h3>
                <span class="pillar-tag">01</span>
            </div>
            <div class="pillar-gallery">
                <img src="../vinnid's/in-out/indoor catering/img2.jpg" alt="Indoor Catering 1">
                <img src="../vinnid's/in-out/indoor catering/img1.jpg" alt="Indoor Catering 2">
                <img src="../vinnid's/in-out/indoor catering/img3.jpg" alt="Indoor Catering 3">
            </div>
        </div>

        <div class="pillar-card">
            <div class="pillar-header">

                <h3>Outdoor Catering</h3>
                <span class="pillar-tag">02</span>
            </div>
            <div class="pillar-gallery">
                <img src="../vinnid's/in-out/outdoor catering/img1.jpg" alt="Outdoor Catering 1">
                <img src="../vinnid's/in-out/outdoor catering/img2.jpg" alt="Outdoor Catering 2">
                <img src="../vinnid's/in-out/outdoor catering/img3.jpg" alt="Outdoor Catering 3">
            </div>
        </div>
    </section>

    <section class="menu-section" id="packages">
        <div class="section-header">
            <h2 class="section-title">Signature Menu Preview</h2>
       
        </div>
        <div class="menu-grid">
            <div class="menu-card">
                <img src="../vinnid's/in-out/t.bone.jpg" alt="T-Bone Steak and Chips">
            </div>
            <div class="menu-card">
                <img src="../vinnid's/in-out/chicken wrap.jpg" alt="Chicken Wrap and Chips">
            </div>
            <div class="menu-card">
                <img src="../vinnid's/in-out/fish.jpg" alt="Fried fish">
            </div>
        </div>
    </section>

</body>
</html>
