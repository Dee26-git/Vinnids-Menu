<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Vinnid Innovations</title>
    
    <style>
        :root {
            --pink-main: #ff69b4;
            --pink-accent: #ff1493;
            --blue-main: #2563eb;
            --dark-bg: #0f172a;
            --text-light: #f8fafc;
            --overlay-dark: rgba(15, 23, 42, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(var(--overlay-dark), var(--overlay-dark)), url('pic3.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .menu-container {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 105, 180, 0.3);
            border-radius: 20px;
            padding: 1.5rem 1rem;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 2rem;
        }

        h1.main-title {
            text-align: center;
            color: #ffffff;
            font-size: clamp(1.3rem, 4vw, 2rem);
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(255, 42, 133, 0.6);
            background-color: var(--pink-accent);
            padding: 0.75rem;
            border-radius: 10px;
            line-height: 1.4;
        }

        .notice-banner {
            background-color: var(--blue-main);
            color: #ffffff;
            text-align: center;
            padding: 0.85rem;
            border-radius: 10px;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .section-heading {
            background-color: var(--pink-accent);
            color: #ffffff;
            text-align: center;
            padding: 0.6rem;
            border-radius: 8px;
            font-size: clamp(1rem, 3vw, 1.3rem);
            margin: 1.5rem 0 1rem 0;
        }

        dl {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        dt {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        dt span {
            word-break: break-word;
        }

        dt p {
            width: 100%;
            font-size: 0.85rem;
            font-weight: normal;
            color: #cbd5e1;
            margin-top: 0.2rem;
        }

        /* Homepage Matching Button Styles */
        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 2rem;
        }

        .menu-btn, .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--pink-main);
            color: #ffffff;
            padding: 0.9rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: background-color 0.3s, transform 0.2s;
            min-width: 160px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        .menu-btn:hover, .back-btn:hover {
            background-color: var(--pink-accent);
            transform: translateY(-2px);
        }

        /* Mobile Adjustments for Touch Screen Devices */
        @media (max-width: 600px) {
            body {
                background-attachment: scroll; /* Fixes mobile background jitter bug */
                padding: 0.5rem;
            }

            .menu-container {
                padding: 1rem 0.75rem;
                border-width: 1px;
            }

            .btn-group {
                flex-direction: column;
                align-items: center;
                gap: 0.75rem;
            }

            .menu-btn, .back-btn {
                width: 100%;
                max-width: 100%;
                padding: 1rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1 class="main-title">Explore Our Kids Menu</h1>
        
        <div class="notice-banner"> COMING SOON !
            
        </div>

        <dl>
            <dt>
                 <span> </span> 
            </dt>
            <dt><span> </span></dt>
            <dt><span> </span></dt>
            <dt><span> </span></dt>
            <dt><span> </span></dt>
            <dt><span> </span></dt>
            <dt><span> </span></dt>
            <dt><span> </span></dt>
            <dt><span> </span></dt>
        </dl>
        
        <div class="btn-group">
            <a href="../ex menu/menu.html" class="back-btn">Back</a>
           
        </div>
    </div>

</body>
</html>
